<!DOCTYPE html>
<html lang="en-AU" data-theme="carbon-soft-v2" data-layout="centred" data-hero="sticky" data-intro="split">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<script src="assets/js/demo-bar.js?v=20"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service — NextLevel Landscaping</title>
<meta name="description" content="Landscaping services across Adelaide by NextLevel Landscaping — licensed builder BLD320507.">
<link rel="icon" href="assets/img/brand/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="assets/css/style.css?v=1793001000">
<link rel="stylesheet" href="assets/css/style-carbon-soft-v2.css?v=1793200000">
<link rel="stylesheet" href="assets/css/demo-bar.css?v=15">
<link rel="stylesheet" href="assets/css/demo-variants.css?v=22">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header-slot"></div>

<main id="main" tabindex="-1">
  <section class="subhero subhero--photo" id="s-subhero">
    <div class="subhero__media" id="s-subhero-media"><img id="s-subhero-img" src="assets/img/services/landscape-design.jpg" alt="" width="1440" height="810" fetchpriority="high" decoding="async"></div>
    <div class="container">
      <p class="crumb"><a href="index.html">Home</a> &nbsp;/&nbsp; <a href="services.html">Services</a> &nbsp;/&nbsp; <span id="crumb-name">Service</span></p>
      <h1 id="s-name">—</h1>
      <p class="lead" id="s-desc"></p>
    </div>
  </section>

  <section class="band svc-detail" id="service-detail" style="--plan-label:'Detail'">
    <div class="container">
      <div class="svc-explorer reveal">
        <div class="svc-left">
          <div class="section-head">
            <span class="eyebrow" id="s-eyebrow"></span>
            <h2 class="sr-only" id="s-heading"></h2>
            <p class="lead" id="s-lead"></p>
          </div>
          <ul class="svc-list" id="s-list"></ul>
        </div>
        <div class="svc-stage">
          <div class="svc-figure" id="s-media"></div>
          <div class="svc-copy" id="s-copy">
            <div class="svc-copy__inner is-on">
              <h3 id="s-title"></h3>
              <p id="s-more"></p>
            </div>
          </div>
          <p class="svc-actions"><a class="btn-ghost btn-ghost--fill" href="contact.html">Get a free quote</a>
            <!-- guide download: shown only for services with a `guide` in data.js; PDFs are placeholders until the client supplies them -->
            <a class="btn-ghost svc-download" id="s-download" href="#" download hidden><i class="fa-solid fa-download" aria-hidden="true"></i><span id="s-download-label"></span></a></p>
        </div>
      </div>
    </div>
  </section>

  <section class="band band--dark contour" style="--plan-label:'Related Work';overflow-x:clip">
    <div class="container">
      <div class="section-head reveal"><span class="eyebrow">Related work</span><h2>Where we've done this</h2></div>
      <div class="swiper proj-swiper" id="s-related-swiper"><div class="swiper-wrapper" id="s-related-track"></div></div>
      <div class="swiper-controls">
        <button id="s-related-prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
        <button id="s-related-next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </section>

  <!-- ===== Full-bleed photo strip ===== -->
  <section class="band band--dark strip-band" id="project-strip" aria-label="Photos of our work">
    <div class="swiper strip" id="strip" data-service="slug"><div class="swiper-wrapper" id="strip-track"></div></div>
    <button class="strip__nav strip__prev" id="strip-prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="strip__nav strip__next" id="strip-next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" aria-label="Close">&times;</button>
  <button class="lb-prev" aria-label="Previous">&larr;</button>
  <img src="" alt="">
  <button class="lb-next" aria-label="Next">&rarr;</button>
</div>

<div id="site-footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/js/partials.js?v=1793000000"></script>
<script src="assets/data.js?v=1793100100"></script>
<script src="assets/js/main.js?v=1793000100"></script>
<script src="assets/js/demo-mega.js?v=2" defer></script>
<script>
(function(){
  var D=window.NLL, list=D.services||[];
  var slug=new URLSearchParams(location.search).get('slug');
  var s=list.find(function(x){return x.slug===slug;})||list[0];
  var plain=s.name.replace(/&amp;/g,'&');

  /* intrinsic dimensions of assets/img/services/* — kept explicit for CLS,
     same map as services.html (Style Guide §10). */
  var DIM = {
    "assets/img/services/landscape-design.jpg": [1440, 810],
    "assets/img/services/paving.jpg":           [1280, 853],
    "assets/img/services/retaining-walls.jpg":  [1440, 960],
    "assets/img/services/fencing.jpg":          [852, 1024],
    "assets/img/services/grass.jpg":            [1440, 1080],
    "assets/img/services/irrigation.jpg":       [1440, 960],
    "assets/img/services/maintenance.jpg":      [1440, 810],
    "assets/img/gallery/penfield-mulched-garden-overview-03.webp": [944, 708],
    "assets/img/gallery/landing-page-mixed-sleeper-walls-turf-08.webp": [1049, 787],
    "assets/img/services/landing-page-mixed-vertical-slat-fence-05.webp": [874, 1166],
    "assets/img/services/somerton-park-backyard-spa-turf-03.webp": [1600, 1067]
  };

  document.title=plain+' — NextLevel Landscaping';
  document.getElementById('crumb-name').textContent=plain;
  document.getElementById('s-name').innerHTML=s.name;
  document.getElementById('s-desc').innerHTML=s.desc;

  var d=DIM[s.img]||[1440,960];
  var heroImg=document.getElementById('s-subhero-img');
  heroImg.src=s.img;
  heroImg.width=d[0];
  heroImg.height=d[1];

  var mainText='Every job starts with an on-site consultation and a 2D & 3D design, so you can see the finished space before we begin. One team handles the whole build.';
  var dec=function(h){var t=document.createElement('textarea');t.innerHTML=h;return t.value;};
  var items=[{label:plain,heading:plain,text:dec(s.desc),img:s.img,w:d[0],h:d[1],fallback:null}].concat((s.subs||[]).map(function(sub){
    var photo=sub.img||s.img;
    var size=(sub.w&&sub.h)?[sub.w,sub.h]:(DIM[photo]||[1440,960]);
    var lab=sub.label.replace(/&amp;/g,'&');
    return {label:lab,heading:lab,text:sub.text,img:photo,fallback:sub.img&&sub.img!==s.img?s.img:null,w:size[0],h:size[1]};
  }));
  var slugify=function(v){return v.toLowerCase().replace(/&amp;/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');};
  var esc=function(t){return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var pad=function(n){return n<10?'0'+n:''+n;};
  var listEl=document.getElementById('s-list'), media=document.getElementById('s-media');
  var titleEl=document.getElementById('s-title'), moreEl=document.getElementById('s-more');
  var copyInner=document.querySelector('#s-copy .svc-copy__inner');
  document.getElementById('s-eyebrow').textContent='Options & materials';
  document.getElementById('s-heading').textContent=plain;
  var leadEl=document.getElementById('s-lead'); if(leadEl) leadEl.textContent=mainText;
  listEl.innerHTML=items.map(function(it,i){
    return '<li><button class="svc-item" type="button" data-i="'+i+'" aria-pressed="false"><span class="svc-item__no">'+pad(i+1)+'</span><span class="svc-item__name">'+esc(it.label)+'</span><span class="svc-item__go"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span></button><div class="svc-accordion-media"><div class="inner"><div class="media"><img loading="lazy" decoding="async" src="'+esc(it.img)+'" alt="" width="'+it.w+'" height="'+it.h+'"></div><p>'+esc(it.text)+'</p></div></div></li>';
  }).join('');
  media.innerHTML=items.map(function(it,i){
    return '<img'+(i?' loading="lazy"':'')+' decoding="async" class="'+(i?'':'is-on')+'" src="'+esc(it.img)+'" alt="'+esc(it.label+' by NextLevel Landscaping in Adelaide')+'" width="'+it.w+'" height="'+it.h+'">';
  }).join('');
  [media,listEl].forEach(function(box){
    box.querySelectorAll('img').forEach(function(im,k){
      im.addEventListener('error',function(){var it=items[box===media?k:k];if(it&&it.fallback&&im.getAttribute('src')!==it.fallback)im.src=it.fallback;});
    });
  });
  if(/\billustrative\b/i.test(s.alt||'')){
    media.insertAdjacentHTML('afterend','<p class="svc-illus">Illustrative photo</p>');
  }
  var btns=listEl.querySelectorAll('.svc-item'), figs=media.querySelectorAll('img');
  var wide=window.matchMedia('(min-width: 901px)');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur=-1, fadeT;
  function paint(i,updateHash,instant){
    if(i===cur||!items[i])return;
    cur=i; var it=items[i];
    btns.forEach(function(b,k){var on=k===i;b.classList.toggle('is-active',on);b.setAttribute('aria-pressed',on?'true':'false');});
    figs.forEach(function(im,k){im.classList.toggle('is-on',k===i);});
    clearTimeout(fadeT);
    var apply=function(){titleEl.textContent=it.heading;moreEl.textContent=it.text;copyInner.classList.add('is-on');};
    if(instant||reduce){apply();}else{copyInner.classList.remove('is-on');fadeT=setTimeout(apply,160);}
    if(updateHash)history.replaceState(null,'','#sub='+encodeURIComponent(slugify(it.label)));
  }
  listEl.addEventListener('click',function(e){
    var b=e.target.closest('.svc-item'); if(!b)return;
    if(!wide.matches&&b.classList.contains('is-active')){b.classList.remove('is-active');b.setAttribute('aria-pressed','false');cur=-1;return;}
    paint(+b.dataset.i,true,false);
  });
  listEl.addEventListener('mouseover',function(e){var b=e.target.closest('.svc-item');if(b&&wide.matches)paint(+b.dataset.i,true,false);});
  listEl.addEventListener('keydown',function(e){
    var b=e.target.closest('.svc-item'); if(!b)return;
    var i=+b.dataset.i,n=btns.length,t=-1;
    if(e.key==='ArrowDown')t=(i+1)%n; else if(e.key==='ArrowUp')t=(i-1+n)%n; else if(e.key==='Home')t=0; else if(e.key==='End')t=n-1; else return;
    e.preventDefault(); btns[t].focus(); if(wide.matches)paint(t,true,false);
  });
  var requested=new URLSearchParams(location.hash.slice(1)).get('sub');
  var initial=items.findIndex(function(it){return slugify(it.label)===requested;});
  paint(initial>-1?initial:0,false,true);
  if(s.guide){
    var dl=document.getElementById('s-download');
    dl.href=s.guide.file;
    document.getElementById('s-download-label').textContent=s.guide.label;
    dl.hidden=false;
  }
  // related projects: match a service tag against project tags
  var key=plain.split(' ')[0].toLowerCase();
  var rel=(D.projects||[]).filter(function(p){
    return p.tags.some(function(t){return t.toLowerCase().indexOf(key)>-1;});
  });
  if(!rel.length) rel=(D.projects||[]).slice(0,3);
  document.getElementById('s-related-track').innerHTML=rel.map(function(r){
    return '<div class="swiper-slide">' +
      '<a class="proj-card" href="project.html?slug='+r.slug+'">' +
        '<div class="media"><img loading="lazy" src="'+r.img+'" alt="'+r.name+'"></div>' +
        '<div class="proj-card__meta"><span>'+r.suburb+'</span><span>&bull;</span><span>'+r.date+'</span></div>' +
        '<h3>'+r.name+'</h3>' +
        '<p>'+r.blurb+'</p>' +
        '<ul class="chips">'+r.tags.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>' +
      '</a>' +
    '</div>';
  }).join('');
  if(window.Swiper){
    new Swiper('#s-related-swiper', {
      slidesPerView: 1.1, spaceBetween: 24,
      breakpoints: { 768: { slidesPerView: 2, spaceBetween: 32 }, 1200: { slidesPerView: rel.length>2?2.4:rel.length, spaceBetween: 40 } },
      navigation: { nextEl: '#s-related-next', prevEl: '#s-related-prev' }
    });
  }

  document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');});
})();
</script>
</body>
</html>
