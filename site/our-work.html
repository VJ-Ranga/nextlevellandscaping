<script src="assets/js/main.js?v=1790200023"></script>
<script>
(function(){
  var grid=document.getElementById('work-grid');
  var projects=window.NLL.projects||[];
  var tilePlan=[
    {project:0,image:0,layout:'feature',caption:true},
    {project:1,image:1,layout:'wide',caption:true},
    {project:2,image:1,layout:'tall',caption:false},
    {project:3,image:2,layout:'detail',caption:false},
    {project:0,image:2,layout:'wide',caption:true},
    {project:1,image:0,layout:'detail',caption:false},
    {project:2,image:3,layout:'tall',caption:true},
    {project:3,image:0,layout:'detail',caption:false},
    {project:0,image:4,layout:'detail',caption:true},
    {project:1,image:3,layout:'wide',caption:false},
    {project:2,image:0,layout:'detail',caption:false},
    {project:3,image:4,layout:'tall',caption:false}
  ];
  function esc(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function renderTiles(){
    grid.innerHTML=tilePlan.map(function(tile,index){
      var p=projects[tile.project];
      if(!p)return '';
      var image=p.gallery&&p.gallery[tile.image]||p.img;
      var caption=tile.caption?'<div class="work-tile__caption"><span class="work-tile__project">'+esc(p.name)+'</span><span class="work-tile__place">'+esc(p.suburb)+' <b aria-hidden="true">/</b> Project view '+(index+1)+'</span></div>':'';
      return '<a class="work-tile work-tile--'+tile.layout+' reveal" href="project.html?slug='+esc(p.slug)+'">'+
        '<article>'+
          '<div class="work-tile__media"><img loading="lazy" decoding="async" src="'+esc(image)+'" alt="Selected project view from '+esc(p.name)+' in '+esc(p.suburb)+'">'+caption+'</div>'+
        '</article></a>';
    }).join('');
    grid.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');});
  }
  renderTiles();
})();
</script>
</body>
</html>
